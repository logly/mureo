name: Security

on:
  schedule:
    - cron: "0 0 * * 1"
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  bandit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: 'pip'
      - name: Install bandit
        run: pip install bandit
      - name: Run bandit scan (report)
        run: bandit -r mureo/ -f json -o bandit-report.json || true
      - name: Run bandit scan (gate)
        run: bandit -r mureo/ -ll -ii
      - name: Upload report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bandit-report
          path: bandit-report.json
