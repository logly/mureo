name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: 'pip'
      - name: Install dependencies
        run: pip install -e ".[dev]"
      # Whole tree, NOT `mureo/`. Gating only the package is how tests/
      # accumulated 638 ruff violations and 26 unformatted files unnoticed —
      # including 43 discarded return values that were missing assertions.
      # `.` also covers scripts/ and anything added later, so a new top-level
      # Python file is linted on the commit that introduces it rather than
      # whenever someone next widens this glob. Test code is held to the same
      # rules as the package; the few that genuinely do not apply are excused
      # one at a time, with reasons, in [tool.ruff.lint.per-file-ignores].
      - name: Ruff check
        run: ruff check .
      - name: Black check
        run: black --check .
      # mypy stays scoped to mureo/. `strict = true` on tests/ would mean
      # annotating every fixture and mock; that is a separate decision, not a
      # side effect of turning on the lint gate.
      - name: Type check
        run: mypy mureo/ --ignore-missing-imports

  # Browser-asset logic guard (#540). mureo/_data/web/reports_logic.js holds
  # the money-safety half of the Reports dashboard — the KPI-withholding
  # condition (#533), the freshness aggregation (#535), the conflict-kind
  # routing. The Python guards in tests/test_web_assets_*.py can only pin
  # substrings; an inverted condition ships green past them. This job
  # EXECUTES that logic.
  #
  # Deliberately dependency-free: Node's built-in test runner, no
  # package.json, no lockfile, no npm install, no new pinned action — it
  # uses the Node preinstalled on the runner. Adding a JS toolchain to a
  # Python project's CI is a real cost, and this keeps it at ~1s and zero
  # supply-chain surface. Independent of `lint` on purpose: a Python
  # formatting failure must not hide a broken money figure.
  #
  # NOTE — the Node version floats with `ubuntu-latest`, ON PURPOSE. Please
  # do NOT "fix" this by adding `actions/setup-node`: that trades a pinned
  # version floor for a third-party action in the supply chain of every CI
  # run. The suite uses only `node:test`, `node:assert` and `node:vm`.
  # `node:test` shipped in Node 18.0.0 as experimental and reached stable in
  # Node 20; `node:assert` and `node:vm` are long-stable. So the real floor
  # is Node 20, and `ubuntu-latest` has shipped well past that since 2023 —
  # the drift risk is a version becoming NEWER, which these APIs are
  # backwards-compatible across. The `node --version` step exists so a
  # future incompatibility is visible in the log instead of being guessed at.
  test-js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Node version
        run: node --version
      - name: Run browser-asset tests
        run: node --test tests/js/*.test.js

  test:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run tests
        run: pytest tests/ --cov=mureo --cov-report=xml --cov-report=term-missing --cov-fail-under=80 -v
      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  # Windows compatibility guard. mureo has no Windows dev machines, so
  # this job is the real-Windows verification: the os.fchmod crash and
  # the %APPDATA% Claude Desktop path are otherwise only exercised by
  # simulation on Linux. Single Python (3.12) — a compat tripwire, not
  # a full matrix; no coverage/codecov (the ubuntu job owns that).
  test-windows:
    needs: lint
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: 'pip'
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run tests
        run: pytest tests/ -q
