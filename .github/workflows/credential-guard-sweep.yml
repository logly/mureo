name: Credential guard sweep

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

# A second run waits for the first instead of cancelling it: a sweep cut off
# half way reports nothing about the guard.
concurrency:
  group: credential-guard-sweep
  cancel-in-progress: false

# issues: write is only for the failure step at the end of the job.
permissions:
  contents: read
  issues: write

jobs:
  # The whole-product enumeration of the Bash credential guard
  # (tests/test_credential_guard_product.py, #808): every guarded command
  # through a real shell, against the guard as the product ships it.
  #
  # Cadence: nightly at 03:23 UTC, and on demand via workflow_dispatch.
  # Rationale: the file does not fit a per-PR budget. It measured 1 h 56 m on
  # a developer machine, against 77 s for the other 63 `slow` tests together,
  # so the per-PR `test-slow` job in ci.yml leaves it out by name and this
  # workflow runs it instead. Nightly still finds a regression within a day of
  # it landing, and the repository is public, so scheduled minutes cost
  # nothing. The timeout leaves room for a hosted runner being slower than
  # the developer machine, under GitHub's 360-minute cap.
  #
  # When it fails or times out: the last step opens an issue labelled
  # `guard-sweep` (or comments on the open one) with the job status and the
  # run URL, and sweep.log is attached to the run as an artifact.  A job that
  # reaches timeout-minutes ends as cancelled rather than failed, so that step
  # also runs on cancelled(); the status in the issue tells a timeout or a
  # manual cancel ("cancelled") apart from a guard failure ("failure"). After fixing the guard, re-run this workflow from
  # the Actions tab (workflow_dispatch) rather than waiting for the next night,
  # and close the issue once that run is green.
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: 'pip'
      - name: Install dependencies
        run: pip install -e ".[dev]"
      # Both the marker and MUREO_RUN_EXHAUSTIVE_TESTS are required (see
      # tests/conftest.py); without the variable every test here skips and the
      # run is green and empty. pipefail keeps pytest's exit status through tee.
      - name: Run the whole-product enumeration
        run: |
          set -o pipefail
          MUREO_RUN_EXHAUSTIVE_TESTS=1 pytest tests/test_credential_guard_product.py -m slow -v -p no:cacheprovider 2>&1 | tee sweep.log
      - name: Upload the sweep log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: credential-guard-sweep-log
          path: sweep.log
          retention-days: 14
      - name: Open or update the failure issue
        if: failure() || cancelled()
        env:
          JOB_STATUS: ${{ job.status }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create guard-sweep --force --color B60205 \
            --description "The nightly credential-guard sweep failed"
          number=$(gh issue list --label guard-sweep --state open \
            --json number --jq '.[0].number // empty')
          if [ -z "$number" ]; then
            gh issue create --title "Credential guard nightly sweep failed" \
              --label guard-sweep \
              --body "The whole-product credential-guard sweep ended with status $JOB_STATUS: $RUN_URL

          sweep.log is attached to the run as an artifact. Re-run the workflow
          (workflow_dispatch) after the fix and close this issue once it is green."
          else
            gh issue comment "$number" --body "The sweep ended with status $JOB_STATUS again: $RUN_URL"
          fi
