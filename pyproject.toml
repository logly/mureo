[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mureo"
version = "0.32.0"
description = "Your local-first AI ad ops crew. Works with Claude Code, Cursor, Codex & Gemini."
requires-python = ">=3.10"
license = "Apache-2.0"
readme = "README.md"
authors = [{name = "Logly, Inc."}]
keywords = ["advertising", "google-ads", "meta-ads", "mcp", "cli", "ai-agent", "orchestration", "workflow", "strategy"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]

dependencies = [
    "google-ads>=32.0,<33",
    "google-auth>=2.28,<3",
    "google-auth-oauthlib>=1.2,<2",
    "httpx>=0.27,<1",
    "beautifulsoup4>=4.12,<5",
    "lxml>=6.1,<7",
    "pydantic>=2.5,<3",
    "typer>=0.12,<1",
    "rich>=13.0,<14",
    "simple-term-menu>=1.6,<2",
    # 1.8.0 is the first release that ships mcp.client.streamable_http, which
    # mureo.learning.federation imports at module level.
    "mcp>=1.8.0,<2",
    # jsonschema validates every built-in tool's inputSchema at the MCP
    # dispatch boundary (mureo.mcp.server._validate_tool_input) so declared
    # bounds like budget/bid `minimum` are enforced server-side before a
    # real-spend API call. Already a transitive dep of mcp; pinned explicitly
    # because we import it directly.
    "jsonschema>=4.20,<5",
    # openpyxl is used by the BYOD bundle importer (mureo byod import
    # --bundle <xlsx>) to read multi-tab Sheets exported from the
    # mureo Sheet template (Apps Script + Google Ads Script).
    "openpyxl>=3.1,<4",
    # PyYAML is used by mureo.core.skills.parser to parse SKILL.md
    # frontmatter via yaml.safe_load (P1-08). Pinned <7 to avoid
    # unannounced API breaks. The hand-rolled alternative was rejected
    # — re-implementing YAML escapes is a worse security surface than
    # the audited safe_load path.
    "pyyaml>=6.0,<7",
    # packaging is used by mureo.web.version_check to PEP 440-compare an
    # index version against the installed one, so a pip constraint that
    # pins a package BELOW what is installed is never mis-reported as an
    # available update. Ubiquitous, tiny, pure-Python; pinned <26 for room.
    "packaging>=23.0,<26",
    # certifi 2026.10.19 drops the compromised emSign ECC Root CA - G3
    # (eMudhra incident, 2026-10). httpx verifies every REST platform call
    # with certifi; the floor makes `mureo upgrade` pull the fixed bundle
    # onto installs that predate it (pip leaves a satisfied dep alone).
    "certifi>=2026.10.19",
    # grpcio ships its own roots.pem (the OS store is never consulted);
    # 1.84.1 is the first release without the compromised root. google-ads
    # already requires grpcio>=1.59.0,<2.0.0, so this only raises the floor.
    "grpcio>=1.84.1,<2",
]

[project.optional-dependencies]
# Creative Studio composition (PR-B). jinja2 renders the HTML/CSS banner
# templates and playwright rasterises them with headless Chromium. Both are
# lazily imported (mureo.creative_studio.composer) so a core install stays
# lean — the tools raise a clear "pip install 'mureo[creative]'" message when
# the extra is absent. PyYAML (brand kit) and httpx (font pipeline) are already
# core deps.
creative = [
    "jinja2>=3.1",
    "playwright>=1.40",
]
dev = [
    # jinja2 backs the composer template unit tests (the browser layer is
    # mocked; playwright stays out of CI — it lives in the "creative"
    # runtime extra only).
    "jinja2>=3.1,<4",
    "pytest>=7.4,<9",
    "pytest-asyncio>=0.23,<1",
    "pytest-cov>=4.1,<7",
    "pytest-mock>=3.12,<4",
    "black>=23.12,<25",
    # 0.12.0 is the first release where PLC0415 is stable (no --preview).
    "ruff>=0.12.0,<1",
    "mypy>=1.8,<2",
]

[project.scripts]
mureo = "mureo.cli.main:app"

[project.urls]
Homepage = "https://github.com/logly/mureo"
Documentation = "https://github.com/logly/mureo/tree/main/docs"
Repository = "https://github.com/logly/mureo"
Issues = "https://github.com/logly/mureo/issues"
Changelog = "https://github.com/logly/mureo/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["mureo"]

# NB: the previous ``[tool.hatch.build.targets.wheel.force-include]``
# block that copied top-level ``.claude/commands/`` and ``skills/`` into
# ``mureo/_data/`` was removed because it duplicated files already
# included via ``packages = ["mureo"]``. The duplicate ZIP entries
# produced a wheel that PyPI rejects with
# ``400 Invalid distribution file. ZIP archive not accepted:
# Mis-matched data size.`` The bundled runtime data lives under
# ``mureo/_data/`` in the package tree and is sufficient on its own.

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
# BLE (flake8-blind-except) flags `except Exception` / `except BaseException`.
# A broad except stays where a wider set of exceptions is genuinely possible
# (platform clients, plugin isolation, best-effort hints), and then it names
# why on the line: `# noqa: BLE001 — <reason>`. Where the failing call and its
# exception types are known, the except is narrowed instead. No path is
# excused, tests/ included (tests/test_ble001_reasons.py, #865).
select = ["E", "F", "I", "N", "W", "UP", "B", "A", "SIM", "TCH", "PLC0415", "BLE"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["mureo"]

# The lint gate covers `tests/` too (see .github/workflows/ci.yml). Three
# rules do not carry over from library code to test code; each is excused
# individually, with its reason, rather than by muting a rule group or a
# file. Anything not listed here is enforced in tests exactly as in mureo/.
[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    # N802 (function name should be lowercase) assumes an ASCII, case-bearing
    # identifier. Test names here deliberately spell out the behaviour under
    # test in Japanese (`test_コンストラクタ_customer_idからハイフン除去`) or quote a
    # platform constant verbatim (`test_GoogleAdsException`, `test_PAUSED`,
    # `test_RESOURCE_NOT_FOUND`). Neither has a lowercase form; renaming ~400
    # of them would destroy the one thing a test name is for.
    "N802",
    # N806 (non-lowercase variable in a function) fires on the name bound by
    # `with patch("...") as MockClient:`. That name IS the class stand-in the
    # patch installed, and PascalCase is how unittest.mock's own docs spell
    # it. In library code a PascalCase local is a smell; here it is the type
    # being replaced.
    "N806",
    # TC001/TC002/TC003 (move a typing-only import into `if TYPE_CHECKING:`)
    # pay for themselves by keeping a library's import graph cheap for
    # everyone downstream. tests/ is not a library — pytest collects these
    # modules and nothing ships them. Test modules DO import each other a
    # little (test_amazon_session_batch -> test_amazon_reversal._FakeClock,
    # test_credential_guard -> hook_guard_runner.run_guard, and two more),
    # but every one of those pulls a runtime value, which is precisely what
    # these rules leave alone. So the saving is nil either way, while the
    # cost is an `if TYPE_CHECKING:` block in ~35 files and a NameError the
    # first time a test wants `Path(...)` at runtime.
    "TC001",
    "TC002",
    "TC003",
    # PLC0415 (import outside the module's top level) guards library code
    # against imports hidden in function bodies. Tests import inside test
    # bodies on purpose: patch first and then import the module under test,
    # skip when an optional dependency is absent, or load a module fresh to
    # check what its import does. Hoisting those would defeat the test.
    # No path under mureo/ is excused (tests/test_plc0415_reasons.py).
    "PLC0415",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "real_save: Opt out of the credentials-write stub and save for real (tmp_path)",
    "slow: Exhaustive runs kept out of the default suite (pytest -m slow)",
]

[tool.mypy]
python_version = "3.10"
strict = true

[[tool.mypy.overrides]]
module = "google.ads.googleads.*"
ignore_missing_imports = true

# PyYAML ships no type stubs by default; ``types-PyYAML`` is a separate
# package on PyPI. Adding it to ``[project.optional-dependencies].dev``
# would force every contributor to reinstall. The two values we actually
# touch (``yaml.safe_load`` and ``yaml.YAMLError``) are well-known and
# narrow — accept the missing-imports override instead.
[[tool.mypy.overrides]]
module = "yaml"
ignore_missing_imports = true

[tool.coverage.run]
source = ["mureo"]
# mureo/mcp/* (the MCP dispatch layer, including server.py input
# validation at the real-spend boundary) is intentionally NOT excluded
# so its security-critical paths count toward fail_under. Only test
# code is omitted.
omit = ["tests/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true
